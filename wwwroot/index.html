<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5b2be0" />
    <meta name="description" content="Wiggly Snake - a friendly, colorful snake game with touch controls, yummy fruit, and playful sounds. Fun for kids and everyone!" />
    <title>Wiggly Snake 🐍 - Fun Snake Game</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SnakeGame.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-snake"></div>
            <p>Loading Wiggly Snake…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Oops! Something wiggled the wrong way.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">✖</a>
    </div>
    <script src="js/audio.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
